x-backend-image: &backend-image
  image: paygrid-backend:latest
  build:
    context: ./backend

x-mcp-image: &mcp-image
  image: paygrid-mcp:latest
  build:
    context: ./mcp

services:
  backend:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - path: ./backend/.env.x402
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      X402_CANARY_EVIDENCE_DIR: /evidence
    volumes:
      - x402-backend-evidence:/evidence
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  indexer:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    command: ["npm", "run", "indexer:start"]

  treasury-worker:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    command: ["npm", "run", "treasury:worker:start"]

  mcp-http:
    <<: *mcp-image
    restart: unless-stopped
    env_file:
      - ./mcp/.env
      - path: ./mcp/.env.x402
        required: false
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      MCP_HTTP_PORT: 3002
      X402_CANARY_EVIDENCE_DIR: /evidence
    volumes:
      - x402-mcp-evidence:/evidence
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  x402-worker:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - path: ./backend/.env.x402.worker
        required: false
    environment:
      NODE_ENV: production
      X402_SELLER_ENABLED: "false"
      X402_PAYER_ENABLED: "false"
      X402_ENV_FILE: /nonexistent-x402-env
    command: ["npm", "run", "x402:worker:start"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  x402-backend-evidence:
  x402-mcp-evidence:
